<section id="section-network" class="page page-module module-c module-a" data-page="network" data-title="同行 · 巨人的肩膀与同行者" data-module="network" data-data-file="./data/memberC/">
  <div class="member-a-dashboard">
    <header class="member-a-hero">
      <div>
        <p class="eyebrow eyebrow--leaf">成员 C · 社会网络生态</p>
        <h2>同行 · 巨人的肩膀与同行者</h2>
      </div>
    </header>

    <div class="member-a-tabs" role="tablist" aria-label="成员 C 可视化任务">
      <button class="member-a-tab is-active" type="button" data-view="overview">总览 · 社会网络</button>
      <button class="member-a-tab" type="button" data-view="migration">合作弧线</button>
      <button class="member-a-tab" type="button" data-view="centers">内部引用</button>
    </div>

    <div class="member-a-content member-c-content">
      <div class="page-visual chart-visual member-a-visual member-c-chart-panel">
        <div class="chart-frame">
          <div class="chart-container mc-root" data-chart-target aria-label="成员 C 三图切换容器">
            <div class="mc-switcher">
              <div class="mc-topbar">
                <div class="mc-tabs" role="tablist" aria-label="切换图表">
                  <button class="mc-tab is-active" type="button" role="tab" data-mc-tab="0">① 团队规模演化</button>
                  <button class="mc-tab" type="button" role="tab" data-mc-tab="1">② 得主合作弧线</button>
                  <button class="mc-tab" type="button" role="tab" data-mc-tab="2">③ 内部引用热力</button>
                </div>
              </div>

              <div class="mc-body">
                <div class="mc-workbench">
                  <div class="mc-viewport">
                    <button class="mc-arrow mc-arrow--prev" type="button" data-mc-prev aria-label="上一张图">‹</button>
                    <button class="mc-arrow mc-arrow--next" type="button" data-mc-next aria-label="下一张图">›</button>

                    <div class="mc-track" data-mc-track>
                      <section class="mc-panel" data-mc-panel="0" role="tabpanel">
                        <div class="mc-controls">
                          <label>按学科筛选：
                            <select data-mc-fig1-category>
                              <option value="all">全部</option>
                              <option value="Physics">Physics</option>
                              <option value="Chemistry">Chemistry</option>
                              <option value="Medicine">Medicine</option>
                            </select>
                          </label>
                        </div>
                        <div class="mc-stage">
                          <svg data-mc-svg="1" preserveAspectRatio="xMidYMid meet"></svg>
                        </div>

                      </section>

                      <section class="mc-panel" data-mc-panel="1" role="tabpanel">
                        <div class="mc-controls">
                          <label>合作篇数不少于：<input data-mc-fig2-minw type="number" value="1" min="1" max="50" step="1" /></label>
                          <label>最多关系条数：<input data-mc-fig2-topn type="number" value="18" min="6" max="40" step="1" /></label>
                          <label>详情论文前 N 篇：<input data-mc-fig2-paper-topn type="number" value="5" min="1" max="20" step="1" /></label>
                          <label class="mc-check"><input data-mc-fig2-animate type="checkbox" checked /> 动态绘制路径</label>
                        </div>
                        <div class="mc-stage">
                          <svg data-mc-svg="2" preserveAspectRatio="xMidYMid meet"></svg>
                        </div>

                      </section>

                      <section class="mc-panel" data-mc-panel="2" role="tabpanel">
                        <div class="mc-controls">
                          <div class="mc-fig3-filter" data-mc-fig3-discipline-panel>
                            <span>学科分类</span>
                            <div class="mc-segmented" role="group" aria-label="选择学科分类">
                              <button type="button" class="is-active" data-mc-fig3-discipline="Physics">物理</button>
                              <button type="button" data-mc-fig3-discipline="Chemistry">化学</button>
                              <button type="button" data-mc-fig3-discipline="Medicine">医学/生物</button>
                            </div>
                          </div>
                          <label>最小引用论文数：<input data-mc-fig3-minw type="number" value="1" min="1" max="500" step="1" /></label>
                          <label>聚合粒度：
                            <select data-mc-fig3-granularity>
                              <option value="decade">十年</option>
                              <option value="five" selected>五年</option>
                              <option value="year">年份</option>
                            </select>
                          </label>
                        </div>
                        <div class="mc-stage">
                          <svg data-mc-svg="3" preserveAspectRatio="xMidYMid meet"></svg>
                        </div>

                      </section>
                    </div>
                  </div>

                  <div class="mc-dots" data-mc-dots aria-hidden="true">
                    <span class="mc-dot is-active"></span>
                    <span class="mc-dot"></span>
                    <span class="mc-dot"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <aside class="member-a-panel member-c-info">
        <div class="mc-summary" data-mc-summary aria-label="当前图表统计信息"></div>

        <section class="mc-notes" data-mc-notes aria-label="当前图表说明"></section>

        <section class="mc-fig2-info" data-mc-fig2-detail>
          <h3>论文详情</h3>
          <p>点击上方任意关系路径，查看样例论文信息。</p>
        </section>

        <section class="mc-fig2-info mc-fig2-author" data-mc-fig2-author>
          <h3>作者信息</h3>
          <p>点击上方任意圆点，查看作者详细信息（占位图像）。</p>
        </section>


      </aside>
    </div>
  </div>
</section>
